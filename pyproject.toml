[project]
name = "bib-expres"
version = "0.1.0"
description = "Herramienta de snowballing bibliografico a partir de un paper padre"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bib-expres = "bib_expres.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lunes 06:00 UTC -- pip-audit tambien sin commits, para enterarse de CVEs
    # nuevas en dependencias que ya van dentro del .exe publicado.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar el paquete
        run: pip install -e ".[dev]"

      - name: Correr tests
        run: pytest -q

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar el paquete
        run: pip install -e ".[dev]"

      - name: pip-audit (entorno de desarrollo)
        run: pip-audit

      - name: pip-audit (versiones exactas del .exe)
        run: pip-audit --no-deps --disable-pip -r packaging/requirements-build.txt
